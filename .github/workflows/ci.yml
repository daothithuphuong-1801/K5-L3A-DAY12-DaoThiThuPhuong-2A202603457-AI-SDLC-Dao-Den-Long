name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Unit + scenario tests (core has no ursina dependency)
        run: python -m pytest -q
      - name: Headless smoke via contract command + determinism
        run: |
          python3 -m game.headless --seed 3 --night 1 --ticks 1200 --out a.jsonl
          python3 -m game.headless --seed 3 --night 1 --ticks 1200 --out b.jsonl
          cmp a.jsonl b.jsonl
          tail -1 a.jsonl
