name: release
# Push a tag v* (or Actions -> release -> "Run workflow" with tag v1.0.0) ->
# tests, then PyInstaller builds for Linux / Windows / macOS + a source bundle, attached to the GitHub Release.
# The release is published with whatever builds succeeded (macOS runners are sometimes unavailable).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)build and release"
        required: true
        default: "v1.0.0"
permissions:
  contents: write
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
  build:
    needs: test
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: Linux, optional: false }
          - { os: windows-latest, label: Windows, optional: false }
          - { os: macos-13, label: macOS, optional: true }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt pyinstaller
      - name: PyInstaller (folder build)
        shell: bash
        run: |
          SEP=":"; [ "$RUNNER_OS" = "Windows" ] && SEP=";"
          pyinstaller --noconfirm --name DaoDenLong --collect-all ursina --collect-all panda3d \
            --collect-all panda3d_gltf --collect-all panda3d_simplepbr \
            --add-data "game/assets${SEP}game/assets" --add-data "game.contract.json${SEP}." launcher.py
          cp README.md LICENSE CREDITS.md dist/DaoDenLong/
      - name: Zip
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "../DaoDenLong-${TAG}-${{ matrix.label }}.zip" DaoDenLong; else zip -qr "../DaoDenLong-${TAG}-${{ matrix.label }}.zip" DaoDenLong; fi
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.label }}
          path: DaoDenLong-*.zip
  release:
    needs: [test, build]
    # publish even if an optional build (macOS) failed or was never picked up by a runner
    if: ${{ always() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - name: Source bundle (run.sh / run.bat)
        run: git archive --format=zip --prefix=DaoDenLong-src/ -o "DaoDenLong-${TAG}-source.zip" HEAD
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { merge-multiple: true }
      - run: ls -la DaoDenLong-*.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Đảo Đèn Lồng ${{ env.TAG }}"
          body_path: docs/release-notes-v1.0.0.md
          fail_on_unmatched_files: false
          files: |
            DaoDenLong-*.zip
